<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Mom and Dad</title>
    <style>
      :root {
        --page-bg: #20242b;
        --panel-bg: #2c313a;
        --panel-edge: #171a1f;
        --panel-line: #454c58;
        --ink: #f4f1e8;
        --ink-dim: #b9bec9;
        --led-bg: #14100a;
        --led-ink: #ffb52e;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --page-bg: #c9ccd2;
          --panel-bg: #dde0e6;
          --panel-edge: #9aa0ab;
          --panel-line: #b4b9c2;
          --ink: #1d2129;
          --ink-dim: #4c5260;
          --led-bg: #1c1710;
          --led-ink: #ffb52e;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--page-bg);
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
        -webkit-tap-highlight-color: transparent;
        padding: 12px 10px 28px;
      }
      .wrap { max-width: 1060px; margin: 0 auto; width: 100%; }

      /* ---------- bottom bar: LED readout + Credits ---------- */
      .foot-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        background: var(--panel-bg);
        border: 2px solid var(--panel-edge);
        border-radius: 16px;
        padding: 10px 12px;
        box-shadow: 0 4px 0 var(--panel-edge);
        margin-bottom: 14px;
      }
      .foot-bar .led { flex: 1 1 auto; min-width: 0; }
      .foot-bar .sound-note { flex: 0 0 auto; }
      .foot-bar .credits-btn { flex: 0 0 auto; }
      .sound-note {
        color: var(--ink-dim);
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }
      .led {
        background: var(--led-bg);
        border-radius: 10px;
        border: 2px solid #000;
        box-shadow: inset 0 2px 10px rgba(0,0,0,.85);
        padding: 8px 12px;
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: clamp(13px, 2.6vw, 16px);
        letter-spacing: .14em;
        color: var(--led-ink);
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .led .dot {
        display: inline-block; width: 9px; height: 9px; border-radius: 50%;
        background: #ff4136; margin-right: 10px; vertical-align: 2px;
        box-shadow: 0 0 8px #ff4136;
      }
      .credits-btn {
        appearance: none;
        background: transparent;
        border: 1.5px solid var(--panel-line);
        color: var(--ink-dim);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 999px;
        cursor: pointer;
      }
      .credits-btn:active { transform: translateY(1px); }

      /* ---------- sections ---------- */
      section.panel {
        background: var(--panel-bg);
        border: 2px solid var(--panel-edge);
        border-radius: 16px;
        box-shadow: 0 4px 0 var(--panel-edge);
        padding: 14px;
        margin-bottom: 14px;
      }
      .title-panel { text-align: center; padding: 12px 14px; }
      .title-panel h1 {
        margin: 0;
        font-size: clamp(22px, 4vw, 30px);
        font-weight: 800;
        letter-spacing: .02em;
        line-height: 1.1;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        width: 100%;
      }
      /* ---------- chunky show buttons ---------- */
      button.fx {
        appearance: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
        text-align: center;
        border-radius: 14px;
        padding: 12px 6px 10px;
        min-height: 76px;
        min-width: 0;
        width: 100%;
        color: #fff;
        background: var(--btn, #666);
        box-shadow: 0 5px 0 var(--btn-edge, #444), 0 8px 10px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.18);
        transition: transform .05s ease, box-shadow .05s ease, filter .15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }
      button.fx:active, button.fx.playing {
        transform: translateY(4px);
        box-shadow: 0 2px 0 var(--btn-edge, #444), 0 4px 6px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.3), inset 0 -2px 0 rgba(0,0,0,.18);
        filter: brightness(1.12);
      }
      button.fx .label {
        display: block;
        font-size: clamp(14px, 2.4vw, 18px);
        font-weight: 800;
        line-height: 1.18;
        text-shadow: 0 2px 0 rgba(0,0,0,.28);
      }

      .b-red    { --btn:#d8362c; --btn-edge:#8f1f19; }
      .b-gold   { --btn:#e8a20c; --btn-edge:#9c6a05; }
      .b-blue   { --btn:#2076c7; --btn-edge:#124e85; }
      .b-teal   { --btn:#0f9488; --btn-edge:#0a5f57; }

      footer {
        color: var(--ink-dim);
        font-size: 12px;
        text-align: center;
        padding: 4px 8px 0;
        line-height: 1.55;
      }
      footer a { color: inherit; }
      footer .credits { font-size: 11px; opacity: .85; }
      footer[hidden] { display: none; }
      /* Phones: keep the 4-across grid. minmax(0,1fr) tracks + min-width:0
         buttons let all four columns fit the portrait viewport; the phrase
         labels wrap to two or three lines instead of clipping. */
      @media (max-width: 640px) {
        body { padding: 10px 8px 24px; }
        .grid { gap: 8px; }
        section.panel { padding: 12px 10px; }
        .foot-bar { padding: 9px 10px; }
        button.fx { min-height: 64px; padding: 10px 3px 9px; border-radius: 12px; }
        button.fx .label { font-size: clamp(10.5px, 2.9vw, 12.5px); line-height: 1.2; }
      }
      @media (prefers-reduced-motion: reduce) {
        button.fx { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">

      <section class="panel title-panel">
        <h1>Mom and Dad</h1>
      </section>

      <section class="panel" aria-label="Things your parents said">
        <div class="grid">
          <button class="fx b-red"   data-file="nice-things" data-name="That's why we can't have nice things!"><span class="label">That's why we can't have nice things!</span></button>
          <button class="fx b-red"   data-file="eye-out"     data-name="It'll put your eye out!"><span class="label">It'll put your eye out!</span></button>
          <button class="fx b-red"   data-file="home-for-dinner"   data-name="Be home for dinner!"><span class="label">Be home for dinner!</span></button>
          <button class="fx b-red"   data-file="because-i-said-so" data-name="Because I said so!"><span class="label">Because I said so!</span></button>
          <button class="fx b-gold"  data-file="dont-touch-that"   data-name="Don't touch that!"><span class="label">Don't touch that!</span></button>
          <button class="fx b-gold"  data-file="hurt-yourself"     data-name="You'll hurt yourself."><span class="label">You'll hurt yourself.</span></button>
          <button class="fx b-gold"  data-file="dont-get-lost"     data-name="Don't get lost."><span class="label">Don't get lost.</span></button>
          <button class="fx b-gold"  data-file="puss-off-face"     data-name="Take that puss off your face."><span class="label">Take that puss off your face.</span></button>
          <button class="fx b-blue"  data-file="quiet"             data-name="Quiet!"><span class="label">Quiet!</span></button>
          <button class="fx b-blue"  data-file="close-the-door"    data-name="Close the door!"><span class="label">Close the door!</span></button>
          <button class="fx b-blue"  data-file="ask-your-mom"      data-name="Ask your mom."><span class="label">Ask your mom.</span></button>
          <button class="fx b-blue"  data-file="play-with-food"    data-name="Don't play with your food."><span class="label">Don't play with your food.</span></button>
          <button class="fx b-teal"  data-file="you-just-wait"     data-name="You just wait."><span class="label">You just wait.</span></button>
          <button class="fx b-teal"  data-file="homework"          data-name="Have you done your homework?"><span class="label">Have you done your homework?</span></button>
          <button class="fx b-teal"  data-file="who-told-you"      data-name="Who told you that?"><span class="label">Who told you that?</span></button>
          <button class="fx b-teal"  data-file="watch-your-mouth"  data-name="Watch your mouth!"><span class="label">Watch your mouth!</span></button>
        </div>
      </section>

      <div class="foot-bar">
        <div class="led" id="led" aria-live="polite"><span class="dot"></span><span id="ledText">Ready</span></div>
        <span class="sound-note">Be sure sound is on</span>
        <button type="button" class="credits-btn" id="creditsBtn" aria-expanded="false" aria-controls="credits">Credits</button>
      </div>

      <footer id="credits" hidden>
        <div class="credits">
          Voices synthesized for this board.<br />
          <a href="https://hickoryhill.com" target="_blank" rel="noopener">© 2026 Steve Coppage &amp; Nina Hinchee</a>
        </div>
      </footer>
    </div>

    <script>
      "use strict";

      /* ============ Real-sample player (Web Audio, decoded buffers) ============ */
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = null, master = null;
      var buffers = {};   // name -> AudioBuffer (decoded)
      var pending = {};   // name -> Promise while loading

      function ac() {
        if (!ctx) {
          ctx = new AC();
          var comp = ctx.createDynamicsCompressor();
          comp.threshold.value = -14;
          comp.knee.value = 20;
          comp.ratio.value = 8;
          comp.attack.value = 0.003;
          comp.release.value = 0.24;
          master = ctx.createGain();
          master.gain.value = 1;
          master.connect(comp);
          comp.connect(ctx.destination);
        }
        if (ctx.state === "suspended") ctx.resume();
        return ctx;
      }

      function loadBuffer(name) {
        if (buffers[name]) return Promise.resolve(buffers[name]);
        if (pending[name]) return pending[name];
        pending[name] = fetch("assets/" + name + ".mp3")
          .then(function (r) {
            if (!r.ok) throw new Error("fetch " + r.status);
            return r.arrayBuffer();
          })
          .then(function (ab) { return ctx.decodeAudioData(ab); })
          .then(function (buf) {
            buffers[name] = buf;
            delete pending[name];
            return buf;
          })
          .catch(function (err) {
            delete pending[name];
            throw err;
          });
        return pending[name];
      }

      function playSample(name) {
        ac();
        loadBuffer(name).then(function (buf) {
          var src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(master);
          src.start(0);
        }).catch(function () {
          // Fallback: plain <audio> element if decoding is unavailable.
          var a = new Audio("assets/" + name + ".mp3");
          a.play();
        });
      }

      /* Warm the HTTP cache for every clip as soon as the page settles,
         so the first tap is quick. */
      function preloadAll() {
        if (!window.fetch) return;
        document.querySelectorAll("button.fx[data-file]").forEach(function (btn) {
          fetch("assets/" + btn.getAttribute("data-file") + ".mp3").catch(function () {});
        });
      }
      if ("requestIdleCallback" in window) requestIdleCallback(preloadAll, { timeout: 2500 });
      else setTimeout(preloadAll, 1200);

      /* ============ Wiring ============ */
      var ledText = document.getElementById("ledText");
      var ledTimer = null;

      document.querySelectorAll("button.fx").forEach(function (btn) {
        btn.addEventListener("click", function () {
          btn.classList.add("playing");
          setTimeout(function () { btn.classList.remove("playing"); }, 220);
          var file = btn.getAttribute("data-file");
          if (!file) return;
          playSample(file);
          ledText.textContent = "Now playing: " + btn.getAttribute("data-name");
          if (ledTimer) clearTimeout(ledTimer);
          ledTimer = setTimeout(function () { ledText.textContent = "Ready"; }, 2600);
        });
      });

      /* Credits button: reveal the footer at the bottom and go to it. */
      var creditsBtn = document.getElementById("creditsBtn");
      var credits = document.getElementById("credits");
      creditsBtn.addEventListener("click", function () {
        var opening = credits.hidden;
        credits.hidden = !opening;
        creditsBtn.setAttribute("aria-expanded", String(opening));
        if (opening) {
          var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          credits.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
        }
      });
    </script>
  </body>
</html>
