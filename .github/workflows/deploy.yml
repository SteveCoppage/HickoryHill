name: Deploy sound effects board
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip site
        run: |
          mkdir -p site
          unzip -o sound-effects-board-site.zip -d site
          if [ ! -f site/index.html ]; then
            sub="$(find site -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -n "$sub" ] && [ -f "$sub/index.html" ]; then cp -r "$sub/." site/; fi
          fi
          # Publish the SoundEffects test copy at /SoundEffects (front page unchanged)
          if [ -d SoundEffects ]; then cp -r SoundEffects site/; fi
          # Publish the MomAndDad board at /MomAndDad (front page unchanged)
          if [ -d MomAndDad ]; then cp -r MomAndDad site/; fi
          # Publish the lowercase momanddad redirect at /momanddad (front page unchanged)
          if [ -d momanddad ]; then cp -r momanddad site/; fi
          # Publish the lowercase soundeffects redirect at /soundeffects (front page unchanged)
          if [ -d soundeffects ]; then cp -r soundeffects site/; fi
          # Publish the Movies board at /Movies (front page unchanged)
          if [ -d Movies ]; then cp -r Movies site/; fi
          # Publish the lowercase movies redirect at /movies (front page unchanged)
          if [ -d movies ]; then cp -r movies site/; fi
          ls -R site
      - name: Set personal page as front page
        run: cp personal-page.html site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
